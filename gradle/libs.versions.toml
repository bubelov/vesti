[versions]
## Foundation
# Android Gradle Plugin
# https://developer.android.com/build/releases/gradle-plugin
agp = "9.4.1"
# This project is Kotlin Multiplatform now
# https://github.com/JetBrains/kotlin/releases
kotlin = "2.4.20"
# Compose Multiplatform
# https://github.com/JetBrains/compose-multiplatform/releases
compose-plugin = "1.13.0-beta02"
# Enables suspending functions
# https://github.com/Kotlin/kotlinx.coroutines/releases
coroutines = "1.11.0"

## Multiplatform libraries (the de-JVM'd core)
# Multiplatform HTTP client, the OkHttp replacement
# https://ktor.io/
ktor = "3.6.0"
# Multiplatform JSON, the Gson replacement
# https://github.com/Kotlin/kotlinx.serialization/releases
kotlinx-serialization = "1.11.0"
# Multiplatform date/time, the java.time replacement
# https://github.com/Kotlin/kotlinx-datetime/releases
kotlinx-datetime = "0.8.0"
# Multiplatform IO, the java.io replacement
# https://square.github.io/okio/
okio = "3.18.2"
# Multiplatform atomics and locks, the java.util.concurrent replacement
# https://github.com/Kotlin/kotlinx.atomicfu
atomicfu = "0.33.0"
# Multiplatform jsoup port: HTML and XML parsing on every target
# https://github.com/fleeksoft/ksoup
ksoup = "0.2.6"

## Handy Android extensions
# Abstracts away platform-dependent SQLite API, with a web (wasm) driver
# https://developer.android.com/jetpack/androidx/releases/sqlite
sqlite = "2.7.1"
# Manages the shared activity and edge-to-edge setup
# https://developer.android.com/jetpack/androidx/releases/activity
androidx-activity = "1.13.0"
# Periodic background sync (the Android host schedules it with WorkManager)
# https://developer.android.com/jetpack/androidx/releases/work
work = "2.11.2"
# Enables embedded browser
# https://developer.android.com/jetpack/androidx/releases/browser
browser = "1.10.0"
# Modern HTTP client, used only by the MockWebServer test dependency now.
# https://github.com/square/okhttp/blob/master/CHANGELOG.md
okhttp = "5.5.0"

# Image loading
# https://github.com/coil-kt/coil/releases
coil = "3.6.3"

# Desktop audio playback. The audio-only module is backed on the JVM by the
# Rust `rodio` crate (JNI), giving MP3/AAC/OGG/FLAC/WAV with position and seek
# without relying on a system media framework.
# https://github.com/kdroidFilter/ComposeMediaPlayer
composemediaplayer = "0.11.4"

# Material design components (themes the Android host)
# https://github.com/material-components/material-components-android/releases
material = "1.14.0"

# Unit tests
# https://junit.org/junit4/
junit = "4.13.2"

[libraries]
kotlinx-coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# KMP core stack
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
ksoup = { module = "com.fleeksoft.ksoup:ksoup", version.ref = "ksoup" }
kotlinx-browser = { module = "org.jetbrains.kotlinx:kotlinx-browser", version = "0.5.0" }

# Database
androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "sqlite" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
androidx-sqlite-bundled-jvm = { module = "androidx.sqlite:sqlite-bundled-jvm", version.ref = "sqlite" }
androidx-sqlite-web = { module = "androidx.sqlite:sqlite-web", version.ref = "sqlite" }

# AndroidX
androidx-activity = { group = "androidx.activity", name = "activity-ktx", version.ref = "androidx-activity" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidx-activity" }
androidx-work = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }

# Networking (test-only now)
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver3-junit4", version.ref = "okhttp" }

# UI
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-ktor = { group = "io.coil-kt.coil3", name = "coil-network-ktor3", version.ref = "coil" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
# Multiplatform back handling, so the Android system back gesture (and the
# browser/desktop equivalents) reach the shared UI instead of closing the app.
compose-ui-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "compose-plugin" }
# Compose resource loader; the desktop window icon is resolved through it.
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-plugin" }

# Desktop audio player
composemediaplayer-audio = { module = "io.github.kdroidfilter:composemediaplayer-audio", version.ref = "composemediaplayer" }

# Unit tests
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Builds an Android target for a Kotlin Multiplatform module. Required because
# AGP 9 no longer supports `com.android.library` alongside the KMP plugin.
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
jetbrains-compose = { id = "org.jetbrains.compose", version.ref = "compose-plugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
